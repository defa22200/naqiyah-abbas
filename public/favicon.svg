<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="waxGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#C45A4C"/>
      <stop offset="55%" stop-color="#9E3B2E"/>
      <stop offset="100%" stop-color="#6B1D13"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5DFAB"/>
      <stop offset="50%" stop-color="#C9A66B"/>
      <stop offset="100%" stop-color="#8C6627"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#3A2C33" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Wax Seal Circle Base -->
  <circle cx="32" cy="32" r="30" fill="url(#waxGrad)" filter="url(#shadow)"/>
  
  <!-- Outer Gold Rim -->
  <circle cx="32" cy="32" r="28" fill="none" stroke="url(#goldGrad)" stroke-width="1.2"/>
  <circle cx="32" cy="32" r="27" fill="none" stroke="#FFFFFF" stroke-width="0.3" stroke-opacity="0.3"/>

  <!-- Inner Dotted Gold Ring -->
  <circle cx="32" cy="32" r="24" fill="none" stroke="url(#goldGrad)" stroke-width="0.9" stroke-dasharray="1.6 1.4"/>
  <circle cx="32" cy="32" r="21.5" fill="none" stroke="url(#goldGrad)" stroke-width="0.4" stroke-opacity="0.6"/>

  <!-- N & A Serif Monogram -->
  <text 
    x="32" 
    y="33.5" 
    text-anchor="middle" 
    dominant-baseline="central" 
    fill="#FCFAF5" 
    font-family="'Cormorant Garamond', 'Georgia', 'Times New Roman', serif" 
    font-size="16.5" 
    font-weight="600" 
    letter-spacing="0.8"
  >
    N&amp;A
  </text>

  <!-- Auspicious Star Mark -->
  <text 
    x="32" 
    y="44.5" 
    text-anchor="middle" 
    dominant-baseline="central" 
    fill="#DFC085" 
    font-family="sans-serif" 
    font-size="6.5" 
    opacity="0.9"
  >
    ✦
  </text>
</svg>
